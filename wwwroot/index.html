<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <title>The IVF Guide -Fertility Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }

    .primary {
      background: #007bff;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .success {
      background: #28a745;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>The IVF Guide - Fertility Dashboard</h1>

  <!-- ROLE -->
  <div class="card">
    <label>Role:</label>
    <select id="role">
      <option value="admin">Admin</option>
      <option value="lab">Lab</option>
      <option value="donor">Donor</option>
    </select>
  </div>
  
  <!-- ADD PATIENT -->
  <div class="card">
    <h3>Add Patient</h3>
    <input id="name" placeholder="Name">
    <input id="age" type="number" placeholder="Age">
<select id="stage">
  <option>Consultation</option>
  <option>Stimulation</option>
  <option>Egg Retrieval</option>
  <option>Fertilization</option>
  <option>Embryo Transfer</option>
  <option>Pregnancy Test</option>
</select>    <button class="success" onclick="addPatient()">Add Patient</button>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <button class="primary" onclick="loadPatients()">Load Patients</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Patients</h3>
    <table id="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Stage</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="status" id="status"></div>

</div>
<script>
const API = window.location.origin;

function getHeaders() {
  return {
    "Content-Type": "application/json",
    "role": document.getElementById("role").value
  };
}

function setStatus(msg, ok=true) {
  const el = document.getElementById("status");
  el.style.color = ok ? "green" : "red";
  el.innerText = msg;
}

async function addPatient() {
  const data = {
    name: name.value,
    age: parseInt(age.value),
    treatmentStage: stage.value
  };

  const res = await fetch(`${API}/patients`, {
    method: "POST",
    headers: getHeaders(),
    body: JSON.stringify(data)
  });

  if (res.ok) {
    setStatus("Patient added");
    loadPatients();
  } else {
    setStatus("Failed (check role)", false);
  }
}

async function loadPatients() {
  const res = await fetch(`${API}/patients`, {
    headers: getHeaders()
  });

  if (!res.ok) {
    setStatus("Unauthorized", false);
    return;
  }

  const data = await res.json();

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  data.forEach(p => {
    tbody.innerHTML += `
      <tr>
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.age}</td>
        <td>${p.treatmentStage}</td>
        <td>
          <button class="danger" onclick="deletePatient(${p.id})">
            Delete
          </button>
        </td>
      </tr>
    `;
  });

  setStatus("Patients loaded");
}

async function deletePatient(id) {
  const res = await fetch(`${API}/patients/${id}`, {
    method: "DELETE",
    headers: getHeaders()
  });

  if (res.ok) {
    setStatus("Deleted");
    loadPatients();
  } else {
    setStatus("Delete failed", false);
  }
}
</script>
